name: Bug Report
description: Create a report to help us improve
title: "[BUG] "
labels: ["bug"]
assignees: []

body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report! 
  
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
      
  - type: textarea
    id: reproduction-steps
    attributes:
      label: To Reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true
      
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true
      
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots/Video
      description: If applicable, add screenshots or a video link to help explain your problem. Paste images directly here.
    validations:
      required: false
      
  - type: input
    id: device
    attributes:
      label: Device
      description: What device are you using?
      placeholder: e.g. iPhone 13, Pixel 6, Emulator
    validations:
      required: true
      
  - type: input
    id: os
    attributes:
      label: OS
      description: What operating system and version?
      placeholder: e.g. iOS 16.0, Android 13
    validations:
      required: true
      
  - type: input
    id: app-version
    attributes:
      label: App Version
      description: Which version of Poka CE are you using?
      placeholder: e.g. 1.0.0
    validations:
      required: true
      
  - type: textarea
    id: application-logs
    attributes:
      label: Application Logs
      description: |
        Please attach the application logs to help us identify the issue. 
        **How to get logs:** Open the app -> Go to **Settings** -> **About** -> Tap on "Export Logs" and paste them here (or attach the file).
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add any other context about the problem here.
    validations:
      required: false
